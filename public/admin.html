<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Roata Norocului</title><style>
*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#10111c;color:#fff}.wrap{max-width:1050px;margin:auto;padding:30px 18px}.card{background:#ffffff0b;border:1px solid #ffffff18;border-radius:20px;padding:22px;margin-bottom:18px}input{padding:11px;border-radius:10px;background:#090a12;color:#fff;border:1px solid #ffffff22}button{padding:11px 15px;border:0;border-radius:10px;background:#f9d66d;font-weight:800;cursor:pointer;margin:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;padding:10px;background:#ffffff08;border-radius:10px}.row .n{flex:1;min-width:180px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #ffffff15}.muted{color:#aaa}@media(max-width:600px){table{font-size:12px}.row{align-items:stretch}.row input.n{width:100%}}
</style></head><body><div class="wrap"><h1>⚙️ Panou Administrator</h1><div id="login" class="card"><h2>Autentificare</h2><input id="pw" type="password" placeholder="Parola admin"><button onclick="login()">Intră</button><p class="muted">Parola este cea setată prin ADMIN_PASSWORD.</p></div><div id="panel" hidden><div class="card"><h2>Premii</h2><div id="prizes"></div><hr><input id="newName" placeholder="Premiu nou"><input id="newWeight" type="number" min="1" value="1"><button onclick="addPrize()">Adaugă</button></div><div class="card"><h2>Câștigători</h2><button onclick="exportCsv()">Export CSV</button><button onclick="clearWinners()">Șterge toți câștigătorii</button><div id="winners"></div></div></div></div><script>
let token="";
async function req(u,o={}){o.headers={...(o.headers||{}),"x-admin-token":token,"Content-Type":"application/json"};const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Eroare");return d}
async function login(){try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;document.getElementById("login").hidden=true;document.getElementById("panel").hidden=false;load()}catch(e){alert(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function load(){const p=await req("/api/admin/prizes");document.getElementById("prizes").innerHTML=p.map(x=>`<div class="row"><input class="n" id="n${x.id}" value="${esc(x.name)}"><input id="w${x.id}" type="number" min="1" value="${x.weight}" style="width:80px"><label><input id="a${x.id}" type="checkbox" ${x.active?"checked":""}> activ</label><button onclick="save(${x.id})">Salvează</button><button onclick="del(${x.id})">Șterge</button></div>`).join("");const w=await req("/api/admin/winners");document.getElementById("winners").innerHTML="<table><tr><th>#</th><th>Nume</th><th>Premiu</th><th>Data</th></tr>"+w.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.prize)}</td><td>${new Date(x.createdAt).toLocaleString("ro-RO")}</td></tr>`).join("")+"</table>"}
async function save(id){await req("/api/admin/prizes/"+id,{method:"PUT",body:JSON.stringify({name:document.getElementById("n"+id).value,weight:+document.getElementById("w"+id).value,active:document.getElementById("a"+id).checked})});load()}
async function del(id){if(confirm("Ștergi premiul?")){await req("/api/admin/prizes/"+id,{method:"DELETE"});load()}}
async function addPrize(){await req("/api/admin/prizes",{method:"POST",body:JSON.stringify({name:document.getElementById("newName").value,weight:+document.getElementById("newWeight").value})});document.getElementById("newName").value="";load()}
async function clearWinners(){if(confirm("Ștergi toți câștigătorii?")){await req("/api/admin/winners",{method:"DELETE"});load()}}
async function exportCsv(){const w=await req("/api/admin/winners");const csv="Nume,Premiu,Data\n"+w.map(x=>`"${String(x.name).replaceAll('"','""')}","${String(x.prize).replaceAll('"','""')}","${x.createdAt}"`).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="castigatori.csv";a.click()}
</script></body></html>
